services:
  web:
    image: docker.io/nginx:alpine
    ports:
      - "8085:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/html/public
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: antrian_ku
      DB_USER: antrian
      DB_PASS: antrianpass
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: antrian_ku
      MYSQL_USER: antrian
      MYSQL_PASSWORD: antrianpass
    volumes:
      - db_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  pma:
    image: docker.io/phpmyadmin:latest
    ports:
      - "9000:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpass
      UPLOAD_LIMIT: 64M
    depends_on:
      - db

volumes:
  db_data:
